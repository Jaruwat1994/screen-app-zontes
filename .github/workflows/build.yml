name: Build APK
on:
  workflow_dispatch:
  push:
    # Pushing a branch release/zontes-N (or a tag zontes-N) publishes a public GitHub Release
    # tagged zontes-N with the APK attached; the tag is created GitHub-side.
    branches: [main, 'test/**', 'feature/**', 'release/**', 'prerelease/**']
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Grant execute permission
        run: chmod +x gradlew

      # Same signing key on every build, so a new APK installs over the old one (settings kept)
      # instead of "app not installed" + uninstall. The key lives in the DEBUG_KEYSTORE_B64 repo
      # secret (base64 JKS, alias androiddebugkey, passwords "android" — what the debugRelease
      # signingConfig and the debug build both read from ~/.android/debug.keystore).
      # ZRide Screen versioning: pushing branch release/v1 (or tag v1, v1.1, …) builds versionName
      # "1" and publishes a GitHub Release tagged v1. Everything else is "<n>-dev".
      - name: Version
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/heads/release/v*) V="${GITHUB_REF_NAME#release/v}"; S="" ;;
            refs/tags/v*)          V="${GITHUB_REF_NAME#v}";         S="" ;;
            *)                     V="1";                            S="-dev.${GITHUB_RUN_NUMBER}" ;;
          esac
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "VERSION_SUFFIX=$S" >> "$GITHUB_ENV"
          echo "versionName: $V$S"
      # ZRide Screen release key (secrets ZRIDE_KEYSTORE_B64 + ZRIDE_KEYSTORE_PASSWORD). Without them the
      # release APK falls back to the debug key below and won't install over a real release.
      - name: Install ZRide release key
        env:
          ZRIDE_KEYSTORE_B64: ${{ secrets.ZRIDE_KEYSTORE_B64 }}
          ZRIDE_KEYSTORE_PASSWORD: ${{ secrets.ZRIDE_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$ZRIDE_KEYSTORE_B64" ]; then
            mkdir -p ~/.zride
            echo "$ZRIDE_KEYSTORE_B64" | base64 -d > ~/.zride/zride-release.jks
            mkdir -p ~/.gradle
            printf 'zrideKeystore=%s\nzrideKeystorePassword=%s\n' "$HOME/.zride/zride-release.jks" "$ZRIDE_KEYSTORE_PASSWORD" >> ~/.gradle/gradle.properties
          else
            echo "::warning::ZRIDE_KEYSTORE_B64 secret not set — release APK is signed with the debug key"
          fi
      - name: Install fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep 'SHA256:' | head -1
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret not set — this APK gets a random key and won't install over the previous one"
            keytool -genkeypair -keystore ~/.android/debug.keystore -storetype JKS -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleGithubDebug -PappVersion="$APP_VERSION" -PversionSuffix="$VERSION_SUFFIX" > debug-build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            grep -E "What went wrong|rror:|^e: " debug-build.log | grep -v "^\s*at " | head -8 \
              | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          fi
          exit $rc
      - name: Build release APK
        shell: bash
        run: |
          set +e
          ./gradlew assembleGithubRelease bundlePlayRelease -PappVersion="$APP_VERSION" -PversionSuffix="$VERSION_SUFFIX" > release-build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            # Annotations are readable through the API even when raw logs are not.
            grep -E "What went wrong|rror:|Lint found|^e: " release-build.log | grep -v "^\s*at " | head -6 \
              | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            grep -vE '^(w: |- To |See https|\s*$)' release-build.log | tail -n 40 | cut -c1-220 | paste -sd '~' \
              | tail -c 3600 | fold -w 900 | while IFS= read -r l; do echo "::error::TAIL ${l}"; done
          fi
          exit $rc
      - name: Unit tests (fork features)
        run: ./gradlew testGithubDebugUnitTest --tests 'dev.zanderp.opencfmoto.SpeedVolumeCurveTest' --tests 'dev.zanderp.opencfmoto.ClockLabTest' --tests 'dev.zanderp.opencfmoto.UpdateCheckerForkTest' --tests 'dev.zanderp.opencfmoto.TrophiesTest' --tests 'dev.zanderp.opencfmoto.TripHighlightsTest' --tests 'dev.zanderp.opencfmoto.CarbitBleNetTest' --tests 'dev.zanderp.opencfmoto.GreenWaveTest' --tests 'dev.zanderp.opencfmoto.TripCompareTest' --tests 'dev.zanderp.opencfmoto.MaintenanceScheduleTest'
      - name: Show signing certificate
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in $(find app/build/outputs/apk/github/release wear/build/outputs/apk/github/release -name '*.apk'); do
            CERT=$("$BT/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256' | head -1 | awk '{print $NF}')
            PKG=$("$BT/aapt2" dump badging "$APK" | head -1 | cut -c1-160)
            echo "::notice::$(basename "$APK") cert=${CERT:0:23}… $PKG"
          done
      - name: Prepare release APK
        id: rel
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
        shell: bash
        run: |
          TAG="v${APP_VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          # Phone APK first; the in-app updater also skips any asset with "wear" in its name.
          cp "$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)" "dist/ZRide-Screen-$TAG.apk"
          # Optional Wear OS companion (install on the watch, not the phone).
          W="$(find wear/build/outputs/apk/github/release -name '*.apk' | head -1)"
          [ -n "$W" ] && cp "$W" "dist/ZRide-Screen-$TAG-WearOS-reloj.apk"
      - name: Create release
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ZRide Screen ${{ steps.rel.outputs.tag }}
          body_path: .github/release-notes.md
          files: dist/*.apk
          prerelease: false
          make_latest: true
      # Pushing a branch prerelease/<name> publishes a GitHub *pre-release* with a direct APK link for
      # testers without a GitHub account. The in-app updater only reads releases/latest, which skips
      # pre-releases, and a "-dev" build is never nagged to update — so nobody else is offered it.
      - name: Prepare test pre-release
        id: pre
        if: startsWith(github.ref, 'refs/heads/prerelease/')
        shell: bash
        run: |
          NAME="${GITHUB_REF_NAME#prerelease/}"
          TAG="test-${NAME}-${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p predist
          cp "$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)" "predist/ZRide-Screen-${TAG}.apk"
          # Watch APK too (the pre-release page is the only place a tester without a GitHub login can get it).
          W="$(find wear/build/outputs/apk/github/release -name '*.apk' | head -1)"
          [ -n "$W" ] && cp "$W" "predist/ZRide-Screen-${TAG}-WearOS-reloj.apk"
      - name: Create test pre-release
        if: steps.pre.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pre.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "ทดสอบ ${{ steps.pre.outputs.name }} (build ${{ github.run_number }}, ยังไม่เสถียร)"
          body: |
            เวอร์ชัน**ทดสอบ** ไม่ใช่เวอร์ชันเสถียร ถ้ารถของคุณใช้งานได้ดีอยู่แล้ว ให้ใช้เวอร์ชันปกติล่าสุด
            ติดตั้งไฟล์ `.apk` ด้านล่างทับแอปเดิมได้เลย (การตั้งค่ายังอยู่) ทดสอบแล้วส่ง log จาก ❓ ช่วยเหลือ → แชร์ log
          files: predist/*.apk
          prerelease: true
          make_latest: false
      # Test APKs get the build number in the file name: all of them used to be
      # "app-github-release.apk", and an older copy with the same name got sent/installed instead.
      - name: Name test APK
        shell: bash
        run: |
          mkdir -p test-apk
          cp "$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)" \
            "test-apk/ZRide-Screen-${{ github.ref_name == 'main' && 'main' || 'test' }}-${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ZRide-Screen-${{ github.ref_name == 'main' && 'main' || 'test' }}-${{ github.run_number }}
          path: test-apk/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ZRide-Screen-WearOS-${{ github.ref_name == 'main' && 'main' || 'test' }}-${{ github.run_number }}
          path: wear/build/outputs/apk/github/release/*.apk
      # Google Play bundles (applicationId app.anonymouse.zridescreen). Not uploadable yet: Play
      # rejects debug-signed bundles — a real upload key comes with the Play Console setup.
      - uses: actions/upload-artifact@v4
        with:
          name: ZRide-Screen-Play-AAB-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            wear/build/outputs/bundle/playRelease/*.aab
